name: Fetch original photos
on:
  push:
    paths: ['originals-list.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download full-size files from Wikimedia Commons
        run: |
          mkdir -p originals
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            name=$(echo "$f" | tr ' ' '_')
            url="https://commons.wikimedia.org/wiki/Special:FilePath/$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$name")"
            curl -sSL -A "MCVR-photo-fetch/1.0 (info@mcvr.co.uk)" -o "originals/$name" "$url" || echo "failed $f"
            sleep 1
          done < originals-list.txt
          ls -la originals
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add originals
          git commit -m "Add full-size original photos" || echo nothing
          git push
